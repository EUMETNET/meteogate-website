# Compression: serve Brotli to clients that support it, otherwise gzip (mod_deflate).
# The content-type restriction lives inside each FilterProvider match expression -
# AddOutputFilterByType can't be used here, since COMPRESS is a dynamic FilterChain
# name (mod_filter), not a real filter a module registered.
<IfModule mod_filter.c>
    FilterDeclare COMPRESS
    FilterProvider COMPRESS DEFLATE "%{req:Accept-Encoding} =~ /\bgzip\b/ && %{CONTENT_TYPE} =~ m#^(text/html|text/plain|text/css|text/javascript|application/javascript|application/json|application/ld\+json|text/xml|application/xml|image/svg\+xml)#"
    FilterProvider COMPRESS BROTLI_COMPRESS "%{req:Accept-Encoding} =~ /\bbr\b/ && %{CONTENT_TYPE} =~ m#^(text/html|text/plain|text/css|text/javascript|application/javascript|application/json|application/ld\+json|text/xml|application/xml|image/svg\+xml)#"
    FilterChain COMPRESS
    FilterProtocol COMPRESS "change=yes;byteranges=no"
</IfModule>

# Caching: asset lifetimes are moderate, not maximal - this site has no cache-busted
# (hashed/versioned) filenames
<IfModule mod_expires.c>
    ExpiresActive On

    ExpiresByType text/css "access plus 1 hour"
    ExpiresByType application/javascript "access plus 1 hour"

    ExpiresByType image/svg+xml "access plus 7 days"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/x-icon "access plus 7 days"

    # Self-hosted font files are effectively immutable in practice.
    ExpiresByType font/woff2 "access plus 365 days"
</IfModule>

# /icons/ (decorative icons, country flags, favicons) changes far less often than
# the other image directories - cache it much more aggressively than the general
# 7-day image rule above.
<IfModule mod_expires.c>
    <LocationMatch "^/icons/">
        ExpiresByType image/svg+xml "access plus 365 days"
        ExpiresByType image/png "access plus 365 days"
        ExpiresByType image/x-icon "access plus 365 days"
    </LocationMatch>
</IfModule>

# Documents and the notifications feed change independently of any cache lifetime
# always revalidate these.
<IfModule mod_headers.c>
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "^notifications\.json$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
